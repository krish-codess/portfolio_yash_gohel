<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Forgot password — Portfolio Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell narrow">
    <div class="card">
      <h1>Forgot password</h1>
      <p class="hint">We'll email you a link to reset it. The link expires in 1 hour.</p>
      <div id="msg" class="msg"></div>
      <form id="forgotForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <div class="row">
          <button type="submit" class="primary" id="submitBtn">Send reset link</button>
          <a class="btn" href="login.html">Back to login</a>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/forgot-password.js"></script>
</body>
</html>
