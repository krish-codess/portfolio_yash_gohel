<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reset password — Portfolio Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-shell narrow">
    <div class="card">
      <h1>Set a new password</h1>
      <p class="hint">Choose a new password. This will log you out everywhere else.</p>
      <div id="msg" class="msg"></div>
      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
        <div class="row">
          <button type="submit" class="primary" id="submitBtn">Set new password</button>
        </div>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
