<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hero — Portfolio Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <nav class="admin-nav">
    <a href="dashboard.html">Portfolio Admin</a>
    <div class="links">
      <span data-user-email></span>
      <a href="media.html">Media</a>
      <a href="account.html">Account</a>
      <button class="link-btn" onclick="adminLogout()">Log out</button>
    </div>
  </nav>
  <div class="admin-shell">
    <a class="btn" href="dashboard.html" style="margin-bottom:20px;display:inline-block">&larr; Back to dashboard</a>
    <h1>Hero</h1>
    <p class="hint" id="statusHint"></p>
    <div id="msg" class="msg"></div>

    <div class="card">
      <label for="tag">Tag line (small text above the headline)</label>
      <input type="text" id="tag">

      <label for="sub">Bio paragraph</label>
      <textarea id="sub" rows="6"></textarea>

      <div class="row">
        <button class="primary" id="saveBtn">Save draft</button>
        <button id="publishBtn">Publish</button>
        <button id="revertBtn">Revert to published</button>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/hero-editor.js"></script>
</body>
</html>
