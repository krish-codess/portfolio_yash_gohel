<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Media — Portfolio Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <nav class="admin-nav">
    <a href="dashboard.html">Portfolio Admin</a>
    <div class="links">
      <span data-user-email></span>
      <a href="media.html">Media</a>
      <a href="account.html">Account</a>
      <button class="link-btn" onclick="adminLogout()">Log out</button>
    </div>
  </nav>
  <div class="admin-shell">
    <a class="btn" href="dashboard.html" style="margin-bottom:20px;display:inline-block">&larr; Back to dashboard</a>
    <h1>Media library</h1>
    <p class="hint">Upload images here, then attach them to a project or hobby's gallery from its edit page.</p>
    <div id="msg" class="msg"></div>

    <div class="upload-drop" id="dropZone">
      Drag an image here, or click to choose a file
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div class="media-grid" id="mediaGrid"></div>
  </div>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/media-library.js"></script>
</body>
</html>
