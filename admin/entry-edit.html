<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Edit entry — Portfolio Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <nav class="admin-nav">
    <a href="dashboard.html">Portfolio Admin</a>
    <div class="links">
      <span data-user-email></span>
      <a href="media.html">Media</a>
      <a href="account.html">Account</a>
      <button class="link-btn" onclick="adminLogout()">Log out</button>
    </div>
  </nav>
  <div class="admin-shell">
    <a class="btn" href="dashboard.html" style="margin-bottom:20px;display:inline-block">&larr; Back to dashboard</a>
    <h1 id="pageTitle">Edit</h1>
    <p class="hint" id="statusHint"></p>
    <div id="msg" class="msg"></div>

    <div class="card">
      <label for="eyebrow">Eyebrow (small label above the title)</label>
      <input type="text" id="eyebrow">

      <label for="title">Title <span style="font-weight:400">(saved, but not shown live yet — see note below)</span></label>
      <input type="text" id="title">

      <label for="lead">Description</label>
      <textarea id="lead" rows="6"></textarea>

      <div class="row">
        <button class="primary" id="saveBtn">Save draft</button>
        <button id="publishBtn">Publish</button>
        <button id="revertBtn">Revert to published</button>
      </div>
      <p class="hint" style="margin-top:16px">
        The title field is kept for your records, but the live page's title has custom
        two-tone styling that a plain text edit can't reproduce yet — only the eyebrow and
        description update on the live site for now.
      </p>
    </div>

    <h2>Gallery images</h2>
    <div class="card">
      <div id="galleryItems"></div>
      <div class="row">
        <select id="addImageSelect"><option value="">Add an image from the media library…</option></select>
        <a class="btn" href="media.html">Upload new image</a>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/entry-editor.js"></script>
</body>
</html>
